version: '3.8'

services:
  # Reverse Proxy & SSL / WebSocket Gateway
  nginx-gateway:
    image: nginx:alpine
    container_name: procucev-nginx-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - transcription-app
    networks:
      - procucev-net

  # Spring Boot Microservice Application
  transcription-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: procucev-transcription-app
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:-transcription_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - procucev-net

  # High-Performance PostgreSQL Persistence
  postgres-db:
    image: postgres:16-alpine
    container_name: procucev-transcription-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transcription_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - procucev-net

volumes:
  pgdata_prod:

networks:
  procucev-net:
    driver: bridge
