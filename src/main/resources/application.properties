spring.application.name=realtime-transcription-service

# Server configuration (Render/Railway use $PORT)
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/transcriptiondb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Multipart file upload limits (supports up to 50MB audio files)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Gemini AI Real-time Audio Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-1.5-flash

# Logging
logging.level.com.procucev.ai=INFO
logging.level.org.springframework.web.socket=INFO
