services:
  - type: web
    name: procucev-realtime-transcription
    runtime: docker
    plan: free
    region: oregon
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: default
      - key: GEMINI_API_KEY
        sync: false
